          package com.jarvis.assistant

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.ContactsContract
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.TelephonyManager
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.RecognitionListener
          import org.vosk.android.SpeechService
          import org.vosk.android.StorageService
          import java.util.Locale

          class ListenService : Service(), RecognitionListener {
              private var model: Model? = null
              private var speech: SpeechService? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              val main = Handler(Looper.getMainLooper())
              private val callbacks = HashMap<String, () -> Unit>()
              private var busy = false
              private var sr: SpeechRecognizer? = null
              private var ringing = false
              private var announced = false

              companion object { var instance: ListenService? = null }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("jarvis", "Jarvis", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "jarvis")
                      .setContentTitle("Jarvis सुन रहा है")
                      .setContentText("\"Jarvis\" बोलिए")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true).build()
                  if (Build.VERSION.SDK_INT >= 30)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)

                  tts = TextToSpeech(this) { st ->
                      if (st == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("hi", "IN")
                          ttsReady = true
                      }
                  }
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) { main.post { callbacks.remove(id)?.invoke() } }
                      @Deprecated("deprecated")
                      override fun onError(id: String?) { main.post { callbacks.remove(id)?.invoke() } }
                  })

                  StorageService.unpack(this, "model", "model",
                      { m -> model = m; startWake() },
                      { _ -> say("सर, आवाज़ का मॉडल लोड नहीं हुआ") })
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "call_state") handleCallState(
                      intent.getStringExtra("state"), intent.getStringExtra("number")
                  )
                  return START_STICKY
              }

              override fun onDestroy() {
                  instance = null
                  stopWake()
                  sr?.destroy()
                  tts?.shutdown()
                  model?.close()
                  super.onDestroy()
              }

              fun say(text: String, then: (() -> Unit)? = null) {
                  if (!ttsReady) { then?.invoke(); return }
                  val id = System.nanoTime().toString()
                  if (then != null) callbacks[id] = then
                  tts?.speak(text, TextToSpeech.QUEUE_ADD, null, id)
              }

              /** बोलकर सवाल पूछो, फिर जवाब सुनो */
              fun ask(prompt: String, onText: (String?) -> Unit) {
                  say(prompt) { listenOnce(onText) }
              }

              fun endSession() {
                  busy = false
                  startWake()
              }

              // ---------- जागने वाला शब्द ----------
              private fun startWake() {
                  val m = model ?: return
                  if (speech != null || busy) return
                  try {
                      val rec = Recognizer(m, 16000f, "[\"jarvis\", \"[unk]\"]")
                      speech = SpeechService(rec, 16000f).also { it.startListening(this) }
                  } catch (e: Exception) { speech = null }
              }

              private fun stopWake() {
                  speech?.stop()
                  speech?.shutdown()
                  speech = null
              }

              private fun checkWake(h: String?) {
                  if (h != null && h.contains("jarvis") && !busy) onWake()
              }

              override fun onPartialResult(h: String?) = checkWake(h)
              override fun onResult(h: String?) = checkWake(h)
              override fun onFinalResult(h: String?) {}
              override fun onError(e: Exception?) {}
              override fun onTimeout() {}

              private fun onWake() {
                  busy = true
                  stopWake()
                  say("हाँ सर, बोलिए") {
                      listenOnce { text ->
                          if (text == null || !Commands.handle(this, text)) endSession()
                      }
                  }
              }

              // ---------- एक बार सुनना (हिंदी) ----------
              private fun listenOnce(cb: (String?) -> Unit) {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      say("आवाज़ पहचान उपलब्ध नहीं है"); cb(null); return
                  }
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  sr = r
                  var finished = false
                  fun finish(text: String?) {
                      if (finished) return
                      finished = true
                      r.destroy()
                      if (sr === r) sr = null
                      cb(text)
                  }
                  r.setRecognitionListener(object : android.speech.RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(e: Int) { finish(null) }
                      override fun onResults(res: Bundle?) {
                          finish(res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull())
                      }
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                      .putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                  r.startListening(i)
                  main.postDelayed({ finish(null) }, 12000)
              }

              // ---------- कॉल आने पर नाम बताना ----------
              private fun handleCallState(state: String?, number: String?) {
                  when (state) {
                      TelephonyManager.EXTRA_STATE_RINGING -> {
                          if (!ringing) {
                              ringing = true; announced = false
                              main.postDelayed({
                                  if (ringing && !announced) { announced = true; say("सर, किसी अननोन नंबर से फ़ोन आ रहा है") }
                              }, 2500)
                          }
                          if (!number.isNullOrBlank() && !announced) {
                              announced = true
                              val name = lookupName(number)
                              say(if (name != null) "सर, $name का फ़ोन आ रहा है" else "सर, किसी अननोन नंबर से फ़ोन आ रहा है")
                          }
                      }
                      else -> { ringing = false; announced = false }
                  }
              }

              private fun lookupName(number: String): String? = try {
                  val uri = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(number))
                  contentResolver.query(uri, arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME), null, null, null)
                      ?.use { if (it.moveToFirst()) it.getString(0) else null }
              } catch (e: Exception) { null }
          }
