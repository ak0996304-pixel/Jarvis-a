          package com.jarvis.assistant

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object ClaudeApi {
              private val main = Handler(Looper.getMainLooper())

              fun hasKey(c: Context) =
                  !c.getSharedPreferences("jarvis", Context.MODE_PRIVATE).getString("api_key", "").isNullOrBlank()

              /** messages: list of (role, content). Callback main thread पर आता है: (जवाब, गलती) */
              fun ask(c: Context, system: String, messages: List<Pair<String, String>>, cb: (String?, String?) -> Unit) {
                  val prefs = c.getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  val key = prefs.getString("api_key", "")?.trim().orEmpty()
                  val model = prefs.getString("model", "")?.trim().takeUnless { it.isNullOrEmpty() } ?: "claude-haiku-5-5"
                  if (key.isEmpty()) { cb(null, "key नहीं है"); return }
                  Thread {
                      var result: String? = null
                      var error: String? = null
                      try {
                          val arr = JSONArray()
                          for ((r, t) in messages) arr.put(JSONObject().put("role", r).put("content", t))
                          val body = JSONObject().put("model", model).put("max_tokens", 300)
                              .put("system", system).put("messages", arr)
                          val con = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                          con.requestMethod = "POST"
                          con.connectTimeout = 15000
                          con.readTimeout = 40000
                          con.doOutput = true
                          con.setRequestProperty("content-type", "application/json")
                          con.setRequestProperty("x-api-key", key)
                          con.setRequestProperty("anthropic-version", "2023-06-01")
                          con.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                          val code = con.responseCode
                          val stream = if (code in 200..299) con.inputStream else con.errorStream
                          val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                          if (code in 200..299) {
                              val content = JSONObject(text).getJSONArray("content")
                              val sb = StringBuilder()
                              for (i in 0 until content.length()) {
                                  val o = content.getJSONObject(i)
                                  if (o.optString("type") == "text") sb.append(o.optString("text"))
                              }
                              result = sb.toString().trim()
                          } else error = "HTTP $code"
                      } catch (e: Exception) { error = e.message ?: "error" }
                      main.post { cb(result, error) }
                  }.start()
              }
          }
