name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'JARVIS_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Jarvis"
          include(":app")
          JARVIS_EOF
          cat > build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          JARVIS_EOF
          cat > gradle.properties <<'JARVIS_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          JARVIS_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.jarvis.assistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.jarvis.assistant"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47")
          }
          JARVIS_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ListenService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".JarvisAccessibility"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver android:name=".CallReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.PHONE_STATE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          JARVIS_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'JARVIS_EOF'
          <resources>
              <string name="app_name">Jarvis</string>
              <string name="acc_desc">फ़ोन लॉक करने और ऐप खोलने के लिए Jarvis को इसकी ज़रूरत है</string>
          </resources>
          JARVIS_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'JARVIS_EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/assistant
          cat > app/src/main/java/com/jarvis/assistant/JarvisAccessibility.kt <<'JARVIS_EOF'
          package com.jarvis.assistant

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Build
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class JarvisAccessibility : AccessibilityService() {
              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onUnbind(intent: Intent?): Boolean { instance = null; return super.onUnbind(intent) }

              fun lock(): Boolean =
                  if (Build.VERSION.SDK_INT >= 28) performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN) else false

              // सुरक्षा के लिए स्क्रीन सिर्फ़ YouTube की ही पढ़ी जाती है, बाकी किसी ऐप की नहीं
              private fun collect(): List<Pair<String, AccessibilityNodeInfo>> {
                  val root = rootInActiveWindow ?: return emptyList()
                  if (root.packageName?.toString() != "com.google.android.youtube") return emptyList()
                  val out = ArrayList<Pair<String, AccessibilityNodeInfo>>()
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null) return
                      val d = n.contentDescription?.toString()?.replace("–", "-")
                      if (!d.isNullOrBlank() && d.length >= 25 && n.isClickable && d.contains(" - ")) {
                          val title = d.split(" - ").first().trim()
                          if (title.isNotEmpty() && out.none { it.first == title }) out.add(title to n)
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(root)
                  return out
              }

              fun videoTitles(): List<String> = collect().map { it.first }

              fun clickVideo(index: Int): Boolean {
                  val list = collect()
                  if (index !in list.indices) return false
                  var n: AccessibilityNodeInfo? = list[index].second
                  while (n != null) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                  }
                  return false
              }

              companion object { var instance: JarvisAccessibility? = null }
          }
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/assistant
          cat > app/src/main/java/com/jarvis/assistant/CallReceiver.kt <<'JARVIS_EOF'
          package com.jarvis.assistant

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.telephony.TelephonyManager

          class CallReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action != TelephonyManager.ACTION_PHONE_STATE_CHANGED) return
                  val st = i.getStringExtra(TelephonyManager.EXTRA_STATE)
                  @Suppress("DEPRECATION")
                  val num = i.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER)
                  try {
                      c.startService(
                          Intent(c, ListenService::class.java).setAction("call_state")
                              .putExtra("state", st).putExtra("number", num)
                      )
                  } catch (_: Exception) {}
              }
          }
          JARVIS_EOF
          mkdir -p app/src/main/java/com/jarvis/assistant
          cat > app/src/main/java/com/jarvis/assistant/Commands.kt <<'JARVIS_EOF'
          package com.jarvis.assistant

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.ContactsContract
          import android.telecom.TelecomManager
          import androidx.core.content.ContextCompat
          import java.text.Normalizer

          object Commands {
              private const val DEV_DIGITS = "०१२३४५६७८९"

              private val stopCall = setOf(
                  "कॉल", "call", "करो", "को", "लगाओ", "फोन", "पर", "जार्विस", "jarvis", "लगा", "कर",
                  "मिलाओ", "डायल", "करें", "कीजिए", "please", "to"
              )
              private val stopOpen = setOf(
                  "खोलो", "खोल", "open", "ओपन", "चालू", "करो", "चलाओ", "जार्विस", "jarvis", "को",
                  "ऐप", "app", "एप", "कर", "दो", "please"
              )
              private val stopYt = stopOpen + setOf(
                  "सर्च", "search", "ढूंढो", "ढूंढ", "ढूँढो", "ढूँढ", "पर", "में", "यूट्यूब", "youtube", "on", "for"
              )
              private val builtin = mapOf(
                  "व्हाट्सएप" to "com.whatsapp", "व्हाट्सऐप" to "com.whatsapp", "वॉट्सऐप" to "com.whatsapp",
                  "whatsapp" to "com.whatsapp", "whats app" to "com.whatsapp",
                  "यूट्यूब" to "com.google.android.youtube", "youtube" to "com.google.android.youtube",
                  "इंस्टाग्राम" to "com.instagram.android", "instagram" to "com.instagram.android",
                  "क्रोम" to "com.android.chrome", "chrome" to "com.android.chrome",
                  "टेलीग्राम" to "org.telegram.messenger", "telegram" to "org.telegram.messenger",
                  "जीमेल" to "com.google.android.gm", "gmail" to "com.google.android.gm",
                  "मैप्स" to "com.google.android.apps.maps", "maps" to "com.google.android.apps.maps"
              )

              private const val CHAT_SYSTEM =
                  "तुम Jarvis हो, एक वॉइस असिस्टेंट। जवाब बहुत छोटा रखो (1-2 वाक्य), सादी हिंदी में, " +
                  "बिना markdown, बिना इमोजी, बिना लिस्ट। यूज़र को 'सर' कहो।"
              private const val DRAFT_SYSTEM =
                  "तुम यूज़र की तरफ़ से एक मैसेज का छोटा जवाब लिख रहे हो। सामने वाले की भाषा और लहज़े में, " +
                  "सिर्फ़ एक छोटा वाक्य। केवल जवाब का टेक्स्ट दो, कोई समझाइश या quotes नहीं।"

              private val history = ArrayList<Pair<String, String>>()

              private fun norm(s: String): String {
                  val d = Normalizer.normalize(s.lowercase(), Normalizer.Form.NFD)
                  val sb = StringBuilder()
                  for (ch in d) {
                      val i = DEV_DIGITS.indexOf(ch)
                      if (i >= 0) sb.append(i) else if (ch != '\u093C') sb.append(ch)
                  }
                  return sb.toString()
              }

              private fun has(t: String, vararg k: String) = k.any { t.contains(it) }
              private fun yes(t: String) = has(t, "हाँ", "हां", "भेज", "yes", "send", "कर दो", "ठीक", "लगाओ", "लगा दो")

              /** true लौटे तो सेशन अभी जारी है (आगे का सवाल/काम चल रहा है) */
              fun handle(s: ListenService, raw: String): Boolean {
                  val t = norm(raw)
                  if (t.isBlank()) return false
                  return when {
                      has(t, "लॉक", "lock", "लाक") -> lock(s)
                      has(t, "जवाब", "रिप्लाई", "reply") -> reply(s)
                      has(t, "मैसेज पढ", "मैसेज सुना", "message") -> readLast(s)
                      has(t, "सर्च", "search", "ढूंढ", "ढूँढ") -> ytSearch(s, t)
                      has(t, "कॉल", "call", "फोन करो", "फोन लगाओ", "डायल") -> call(s, t)
                      has(t, "खोल", "open", "ओपन", "चालू", "चलाओ") -> open(s, t)
                      else -> chat(s, raw)
                  }
              }

              // ---------- फ़ोन लॉक ----------
              private fun lock(s: ListenService): Boolean {
                  if (JarvisAccessibility.instance?.lock() != true) s.say("सर, Accessibility चालू नहीं है")
                  return false
              }

              // ---------- बातचीत (Claude) ----------
              private fun chat(s: ListenService, raw: String): Boolean {
                  if (!ClaudeApi.hasKey(s)) { s.say("सर, Settings में Claude की key नहीं डाली है"); return false }
                  history.add("user" to raw)
                  while (history.size > 8) history.removeAt(0)
                  ClaudeApi.ask(s, CHAT_SYSTEM, history.toList()) { r, _ ->
                      if (r != null) {
                          history.add("assistant" to r)
                          s.say(r) { s.endSession() }
                      } else {
                          if (history.isNotEmpty()) history.removeAt(history.size - 1)
                          s.say("सर, AI से जवाब नहीं मिला") { s.endSession() }
                      }
                  }
                  return true
              }

              // ---------- मैसेज पढ़ना और जवाब देना ----------
              private fun readLast(s: ListenService): Boolean {
                  val m = NotifService.last
                  if (m == null) s.say("सर, कोई नया मैसेज नहीं है")
                  else s.say("${m.sender} का मैसेज: ${m.text}")
                  return false
              }

              private fun reply(s: ListenService): Boolean {
                  val m = NotifService.last
                  if (m == null || m.action == null) { s.say("सर, जवाब देने लायक कोई मैसेज नहीं है"); return false }
                  s.ask("क्या जवाब लिखूँ सर? या बोलिए, तुम सोचो") { ans ->
                      if (ans == null) {
                          s.endSession()
                      } else if (has(norm(ans), "सोचो", "खुद", "तुम सोच", "आप सोच")) {
                          if (!ClaudeApi.hasKey(s)) { s.say("सर, Claude की key नहीं डाली है") { s.endSession() } }
                          else ClaudeApi.ask(s, DRAFT_SYSTEM, listOf("user" to "${m.sender} ने मैसेज भेजा: ${m.text}")) { r, _ ->
                              if (r != null) confirmSend(s, m, r.trim())
                              else s.say("सर, AI से जवाब नहीं मिला") { s.endSession() }
                          }
                      } else {
                          confirmSend(s, m, ans.trim())
                      }
                  }
                  return true
              }

              private fun confirmSend(s: ListenService, m: NotifService.Msg, draft: String) {
                  s.ask("लिखा है: $draft. भेज दूँ?") { a ->
                      if (a != null && yes(norm(a))) {
                          val ok = NotifService.sendReply(s, m, draft)
                          s.say(if (ok) "भेज दिया सर" else "सर, भेज नहीं पाया")
                      } else s.say("ठीक है, नहीं भेजा")
                      s.endSession()
                  }
              }

              // ---------- YouTube सर्च ----------
              private fun ytSearch(s: ListenService, t: String): Boolean {
                  val q = t.split(Regex("\\s+")).filter { it.isNotBlank() && it !in stopYt }.joinToString(" ")
                  if (q.isBlank()) { s.say("क्या सर्च करूँ सर"); return false }
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q)))
                      .setPackage("com.google.android.youtube").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val ctx: Context = JarvisAccessibility.instance ?: s
                  try { ctx.startActivity(i) } catch (e: Exception) { s.say("यूट्यूब नहीं खुल पाया"); return false }
                  s.say("यूट्यूब पर $q खोज रहा हूँ")
                  s.main.postDelayed({ readResults(s, 0) }, 5000)
                  return true
              }

              private fun readResults(s: ListenService, attempt: Int) {
                  val titles = JarvisAccessibility.instance?.videoTitles() ?: emptyList()
                  if (titles.isEmpty()) {
                      if (attempt < 2) s.main.postDelayed({ readResults(s, attempt + 1) }, 2500)
                      else s.say("सर, नतीजे पढ़ नहीं पाया") { s.endSession() }
                      return
                  }
                  val top = titles.take(4)
                  val speech = top.mapIndexed { i, x -> "${i + 1}. $x" }.joinToString(". ")
                  s.ask("$speech. कौन सा चलाऊँ?") { ans ->
                      val idx = ans?.let { pickIndex(norm(it)) }
                      if (idx != null && idx < top.size) {
                          if (JarvisAccessibility.instance?.clickVideo(idx) != true) s.say("सर, वीडियो नहीं चला पाया")
                      }
                      s.endSession()
                  }
              }

              private fun pickIndex(t: String): Int? = when {
                  has(t, "पहला", "पहले", "first", "1", "एक") -> 0
                  has(t, "दूसरा", "दूसरे", "second", "2", "दो") -> 1
                  has(t, "तीसरा", "तीसरे", "third", "3", "तीन") -> 2
                  has(t, "चौथा", "चौथे", "fourth", "4", "चार") -> 3
                  else -> null
              }

              // ---------- कॉल ----------
              private fun granted(c: Context, p: String) =
                  ContextCompat.checkSelfPermission(c, p) == PackageManager.PERMISSION_GRANTED

              private fun call(s: ListenService, t: String): Boolean {
                  val digits = t.filter { it.isDigit() }
                  if (digits.length >= 7) return dial(s, digits, digits.toCharArray().joinToString(" "))
                  val name = t.split(Regex("\\s+")).filter { it.isNotBlank() && it !in stopCall }.joinToString(" ")
                  if (name.isBlank()) { s.say("किसे कॉल करना है सर"); return false }
                  if (!granted(s, Manifest.permission.READ_CONTACTS)) { s.say("कॉन्टैक्ट की अनुमति नहीं है"); return false }
                  val found = LinkedHashMap<String, String>()
                  s.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI, arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER),
                      "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?", arrayOf("%$name%"), null
                  )?.use { while (it.moveToNext()) found.putIfAbsent(it.getString(0), it.getString(1)) }
                  if (found.isEmpty()) { s.say("$name नाम कॉन्टैक्ट में नहीं मिला"); return false }
                  val pick = found.entries.firstOrNull { it.key.equals(name, true) }
                      ?: if (found.size == 1) found.entries.first() else null
                  if (pick == null) {
                      s.say("कई नाम मिले: " + found.keys.take(3).joinToString(", ") + ". पूरा नाम बोलिए")
                      return false
                  }
                  return dial(s, pick.value, pick.key)
              }

              private fun dial(s: ListenService, number: String, spoken: String): Boolean {
                  if (!granted(s, Manifest.permission.CALL_PHONE)) { s.say("कॉल की अनुमति नहीं है"); return false }
                  val confirm = s.getSharedPreferences("jarvis", Context.MODE_PRIVATE).getBoolean("confirm_call", true)
                  if (confirm) {
                      s.ask("$spoken को कॉल लगाऊँ?") { a ->
                          if (a != null && yes(norm(a))) place(s, number) else s.say("ठीक है, कॉल नहीं की")
                          s.endSession()
                      }
                      return true
                  }
                  s.say("$spoken को कॉल लगा रहा हूँ") { place(s, number) }
                  return false
              }

              private fun place(s: ListenService, number: String) {
                  try {
                      s.getSystemService(TelecomManager::class.java)
                          .placeCall(Uri.fromParts("tel", number, null), Bundle())
                  } catch (e: SecurityException) { s.say("सर, कॉल नहीं लग पाई") }
              }

              // ---------- ऐप खोलना ----------
              private fun open(s: ListenService, t: String): Boolean {
                  val name = t.split(Regex("\\s+")).filter { it.isNotBlank() && it !in stopOpen }.joinToString(" ")
                  if (name.isBlank()) { s.say("कौन सा ऐप खोलूँ सर"); return false }
                  val pkg = resolve(s, name)
                  val intent = pkg?.let { s.packageManager.getLaunchIntentForPackage(it) }
                  if (intent == null) { s.say("$name ऐप नहीं मिला"); return false }
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val ctx: Context = JarvisAccessibility.instance ?: s
                  try { ctx.startActivity(intent) } catch (e: Exception) { s.say("ऐप नहीं खुल पाया") }
                  return false
              }

              private fun resolve(c: Context, name: String): String? {
                  val prefs = c.getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  for (e in prefs.getStringSet("aliases", emptySet()) ?: emptySet()) {
                      val parts = e.split("|")
                      if (parts.size == 2 && parts[0].isNotEmpty() && name.contains(parts[0])) return parts[1]
                  }
                  builtin.entries.firstOrNull { name.contains(it.key) }?.let { return it.value }
                  return findByLabel(c, name)
              }

              fun findByLabel(c: Context, name: String): String? {
                  val n = name.trim().lowercase()
                  if (n.isEmpty()) return null
                  val pm = c.packageManager
                  val apps = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  )
                  val labeled = apps.map { it.loadLabel(pm).toString().lowercase() to it.activityInfo.packageName }
                  return labeled.firstOrNull { it.first == n }?.second
                      ?: labeled.firstOrNull { it.first.contains(n) || n.contains(it.first) }?.second
              }

              fun addAlias(c: Context, alias: String, appName: String): Boolean {
                  val pkg = findByLabel(c, appName) ?: return false
                  val prefs = c.getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  val set = HashSet(prefs.getStringSet("aliases", emptySet()) ?: emptySet())
                  set.add("${norm(alias).trim()}|$pkg")
                  prefs.edit().putStringSet("aliases", set).apply()
                  return true
              }
          }
