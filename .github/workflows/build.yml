          package com.jarvis.assistant

          import android.app.Notification
          import android.app.RemoteInput
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotifService : NotificationListenerService() {

              class Msg(val sender: String, val text: String, val action: Notification.Action?)

              companion object {
                  var last: Msg? = null
                  val DEFAULT_PKGS = setOf(
                      "com.whatsapp", "com.whatsapp.w4b", "org.telegram.messenger",
                      "com.google.android.apps.messaging"
                  )

                  fun sendReply(ctx: Context, m: Msg, text: String): Boolean {
                      val a = m.action ?: return false
                      val ri = a.remoteInputs ?: return false
                      return try {
                          val intent = Intent()
                          val b = Bundle()
                          for (r in ri) b.putCharSequence(r.resultKey, text)
                          RemoteInput.addResultsToIntent(ri, intent, b)
                          a.actionIntent.send(ctx, 0, intent)
                          true
                      } catch (e: Exception) { false }
                  }
              }

              private var lastKey = ""
              private var lastTime = 0L

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val prefs = getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  val pkgs = prefs.getStringSet("notif_pkgs", DEFAULT_PKGS) ?: DEFAULT_PKGS
                  if (sbn.packageName !in pkgs) return
                  val n = sbn.notification
                  if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                  val e = n.extras
                  val title = e.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = e.getCharSequence(Notification.EXTRA_TEXT)?.toString()?.take(200)

                  val now = System.currentTimeMillis()
                  if (n.category == Notification.CATEGORY_CALL) {
                      if (dup("call$title", now)) return
                      ListenService.instance?.say("सर, $title का कॉल आ रहा है")
                      return
                  }
                  if (text.isNullOrBlank()) return
                  val action = n.actions?.firstOrNull { it.remoteInputs?.isNotEmpty() == true } ?: return
                  if (dup(title + text, now)) return
                  last = Msg(title, text, action)
                  ListenService.instance?.say("$title का मैसेज आया है: $text")
              }

              private fun dup(key: String, now: Long): Boolean {
                  if (key == lastKey && now - lastTime < 4000) return true
                  lastKey = key; lastTime = now
                  return false
              }
          }
